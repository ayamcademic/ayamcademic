name: Update Readme

on:
  schedule:
    - cron: "1 3 * * *"
  workflow_dispatch:

jobs:
  Update:
    name: Update Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false   
      - uses: mahyarmirrashed/action-github-readme-stats@main
        with:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          TIMEZONE: "Asia/Makassar"
          FEATURES: "DAY_STATS,WEEK_STATS,LANGUAGE_STATS"
      - name: "Commit changes"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update readme via actions"
            git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:main
          fi
